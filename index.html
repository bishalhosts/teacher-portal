<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Attendance Portal</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12306b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#eef1f6;color:#1b2433;padding-bottom:84px}
.strip{height:6px;background:#c62828}
header{background:#12306b;color:#fff;text-align:center;padding:16px 10px}
h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.85;font-size:14px}
.bar{position:sticky;top:0;background:#fff;border-bottom:2px solid #12306b;padding:8px 12px;display:flex;justify-content:space-between;gap:8px;font-size:14px;z-index:2}
.bar a{color:#c62828;cursor:pointer;text-decoration:underline}
.card{background:#fff;border:1px solid #c9d1de;margin:14px auto;max-width:520px;padding:16px}
input,button{font:inherit;padding:12px;width:100%;margin:6px 0;border:1px solid #8a96ab;border-radius:0}
button{background:#12306b;color:#fff;border:0;cursor:pointer}
button:disabled{opacity:.5}
.row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid #e3e7ef}
.row.rp{background:#f1faf1}
.row.ra{background:#fdecec}
.row b{width:34px}
.row span{flex:1}
.row button{width:64px;margin:0;padding:14px 0;font-size:20px;font-weight:700;background:#fff;color:#1b2433;border:2px solid #8a96ab}
.row button.p{background:#1e8a3e;color:#fff;border-color:#1e8a3e}
.row button.a{background:#c62828;color:#fff;border-color:#c62828}
.foot{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #12306b;padding:8px 12px;display:flex;gap:8px;align-items:center}
.foot button{margin:0;width:auto;flex:1}
.foot .g{background:#fff;color:#12306b;border:1px solid #12306b;flex:0 0 auto}
#msg{text-align:center;font-weight:600;min-height:22px;margin:8px}
.err{color:#c62828}
.ok{color:#1e8a3e}
.success-box{background:#d9ead3;border:2px solid #1e8a3e;color:#1e8a3e;padding:24px 16px;text-align:center;border-radius:6px}
.success-box .tick{font-size:64px;line-height:1}
.success-box h2{margin:8px 0 10px;font-size:26px}
.success-box p{margin:0 0 18px;font-weight:600;font-size:16px}
.success-box button{background:#1e8a3e;width:auto;padding:12px 28px;margin:0 auto;display:inline-block;font-weight:700}
.success-box #lockMsg{color:#c62828;margin:0}
small{color:#5a6577}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="strip"></div>
<header><h1 id="school"></h1><p id="sub"></p></header>
<div id="msg"></div>

<div class="card" id="login" hidden>
  <b>Enter weekly code</b>
  <input id="code" placeholder="6-character code" autocomplete="off" maxlength="10">
  <button id="lbtn" onclick="login()">Continue</button>
  <small>Your code changes every Sunday at 12 AM.</small>
</div>

<div class="card" id="pinScreen" hidden>
  <b>Welcome back, <span id="pinName"></span></b>
  <input id="pin" type="password" placeholder="Enter 4-digit PIN" inputmode="numeric" maxlength="4" autocomplete="off">
  <button id="pbtn" onclick="checkPin()">Open App</button>
  <small><a onclick="logout()" style="color:#c62828;cursor:pointer">Log out &amp; enter code again</a></small>
</div>

<div id="app" hidden>
  <div class="bar"><span id="who"></span><span><a onclick="logout()">Logout</a></span></div>
  <div class="card">
    <div id="successBox" class="success-box" hidden>
      <div class="tick">✅</div>
      <h2>Attendance Completed</h2>
      <p id="successMsg"></p>
      <button id="editBtn" onclick="enableEdit()">Edit Attendance</button>
      <p id="lockMsg" hidden>Attendance is locked after 6:00 PM.</p>
    </div>
    <div id="markSection" hidden><div id="list"></div></div>
  </div>
  <div class="foot" id="footBar" hidden>
    <b id="cnt"></b>
    <button class="g" onclick="copyAbs()">Copy absent</button>
    <button id="sbtn" onclick="save()">Save</button>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzjR4l_DgGrG9F0A_3YsN4EF6kaeVHCvoKXgLWG3wHyD0o6yPqTVFPobz6JAyQMAnoC/exec';
const SCHOOL = 'JanaPrakash School';
const SUB = 'Daily Attendance Portal';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => '&#' + c.charCodeAt(0) + ';');

let code = localStorage.getItem('code') || '', teacher = localStorage.getItem('teacher') || '', cls = '', savedPin = '';
let D = null, list = [], lastTaken = null, skew = 0, loginP = null, dataP = null, dataAt = 0;

$('school').textContent = SCHOOL; $('sub').textContent = SUB; document.title = SCHOOL;
function msg(t, c) { $('msg').textContent = t; $('msg').className = c || ''; }
function locked() { return D && Date.now() + skew >= D.lockAt; } // 6:00 PM Nepal time, taken from the server's clock

async function call(o) {
  if (API.indexOf('YOUR_WEB_APP') >= 0) throw new Error('Put your Apps Script web app URL in index.html (API).');
  o.code = code;
  const r = await fetch(API, { method: 'POST', body: JSON.stringify(o) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function setUser(r) {
  savedPin = String(r.pin || '');
  if (!savedPin) throw new Error('No PIN set for this teacher in the Sheet.');
  teacher = r.teacher; cls = r.cls; localStorage.setItem('teacher', teacher);
}
// Loads students and today's marks in the background, so they are ready when the PIN is entered.
function fetchData() { dataAt = Date.now(); dataP = call({ action: 'pullData' }); dataP.catch(() => {}); return dataP; }
function showPin() { $('login').hidden = true; $('pinScreen').hidden = false; $('pinName').textContent = teacher; $('pin').value = ''; $('pin').focus(); }
function fail(e) {
  let m = e.message;
  if (/^Bad request/.test(m)) m = 'The server is out of date. In Apps Script: Deploy > Manage deployments > Edit > New version > Deploy.';
  dataP = null;
  if (/wrong|expired|not assigned/i.test(m)) {
    localStorage.removeItem('code'); code = ''; loginP = null;
    $('pinScreen').hidden = true; $('app').hidden = true; $('login').hidden = false;
  }
  msg(m, 'err');
}

async function login() {
  code = $('code').value.trim().toUpperCase();
  if (!code) return;
  $('lbtn').disabled = true; msg('Verifying code...');
  try {
    setUser(await call({ action: 'login' }));
    localStorage.setItem('code', code);
    fetchData();                     // start loading now, but show nothing until the PIN is correct
    showPin(); msg('Code verified. Enter your PIN.', 'ok');
  } catch (e) { fail(e); }
  $('lbtn').disabled = false;
}

async function checkPin() {
  const p = $('pin').value.trim(); if (!p) return;
  $('pbtn').disabled = true; msg('Checking PIN...');
  try {
    if (!savedPin && !loginP) loginP = call({ action: 'login' });
    if (loginP) { setUser(await loginP); loginP = null; }
    if (p !== savedPin) { msg('Wrong PIN', 'err'); $('pin').value = ''; return; }
    $('pinScreen').hidden = true; $('app').hidden = false; msg('Loading attendance...');
    render(!dataP || Date.now() - dataAt > 120000 ? await fetchData() : await dataP);
  } catch (e) {
    $('app').hidden = true; loginP = null; if ($('login').hidden) $('pinScreen').hidden = false; fail(e);
  } finally { $('pbtn').disabled = false; }
}

function render(r) {
  D = r.d; skew = D.now - Date.now();
  $('who').textContent = teacher + ' | Class ' + cls + ' | ' + D.label.split(' | ').join(' ');
  msg('');
  if (D.closed) {
    $('successBox').hidden = true; $('footBar').hidden = true; $('markSection').hidden = false;
    $('list').innerHTML = '<p class="err" style="text-align:center;font-weight:700;padding:20px">School closed today: ' + esc(D.closed) + '</p>';
    return;
  }
  list = r.list.map(s => ({ roll: s.roll, name: s.name, s: r.marks[String(s.roll)] === 'A' ? 'A' : 'P' }));
  lastTaken = r.taken;
  if (r.taken) showSuccess(r.taken); else showForm();
}

function showSuccess(t) {
  $('successBox').hidden = false; $('markSection').hidden = true; $('footBar').hidden = true;
  $('successMsg').textContent = 'Submitted at ' + t.time + ' by ' + t.by;
  const lk = locked(); $('editBtn').hidden = lk; $('lockMsg').hidden = !lk; msg('');
}

function showForm() {
  $('successBox').hidden = true; $('markSection').hidden = false;
  if (locked()) {
    $('footBar').hidden = true; msg('');
    $('list').innerHTML = '<p class="err" style="text-align:center;font-weight:700;padding:20px">Attendance is locked after 6:00 PM.</p>';
    return;
  }
  $('footBar').hidden = false; $('sbtn').disabled = false;
  msg(lastTaken ? 'Editing saved attendance. Green = present, red = absent.' : 'Please mark attendance.');
  draw();
}

function enableEdit() { if (locked()) showSuccess(lastTaken); else showForm(); }

function draw() {
  $('list').innerHTML = list.map((s, i) =>
    `<div class="row ${s.s == 'A' ? 'ra' : 'rp'}"><b>${esc(s.roll)}</b><span>${esc(s.name)}</span><button class="${s.s == 'P' ? 'p' : ''}" onclick="mark(${i},'P')">P</button><button class="${s.s == 'A' ? 'a' : ''}" onclick="mark(${i},'A')">A</button></div>`
  ).join('') || '<p>No students found.</p>';
  const p = list.filter(s => s.s == 'P').length;
  $('cnt').textContent = 'P ' + p + ' | A ' + (list.length - p);
}
function mark(i, v) { list[i].s = v; draw(); }

async function save() {
  const p = list.filter(s => s.s == 'P').length, a = list.length - p;
  if (!list.length || !confirm('Class ' + cls + ': ' + p + ' present, ' + a + ' absent. Save?')) return;
  $('sbtn').disabled = true; msg('Saving...');
  try {
    const r = await call({ action: 'save', marks: list.map(s => ({ roll: s.roll, s: s.s })) });
    lastTaken = { time: r.time, by: teacher };
    showSuccess(lastTaken); msg('Saved successfully!', 'ok');   // list, Copy absent and Save disappear here
  } catch (e) { msg('Not saved: ' + e.message, 'err'); }
  $('sbtn').disabled = false;
}

function copyAbs() {
  const t = 'Class ' + cls + ' absent (' + (D ? D.label.split(' | ')[2] : '') + '): ' + (list.filter(s => s.s == 'A').map(s => s.roll + ' ' + s.name).join(', ') || 'none');
  navigator.clipboard.writeText(t).then(() => msg('Absent list copied', 'ok'));
}

function logout() { localStorage.removeItem('code'); localStorage.removeItem('teacher'); location.reload(); }

$('code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });

// Already logged in on this phone: ask for the PIN, and load the data quietly while the teacher types it.
if (code && teacher) {
  showPin();
  loginP = call({ action: 'login' });
  loginP.then(r => { setUser(r); fetchData(); }).catch(() => {});
} else { $('login').hidden = false; }
</script>
</body>
</html>
